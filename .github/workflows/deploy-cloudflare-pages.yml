name: Deploy SocioDetective to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'functions/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare Pages publish directory
        run: |
          test -f web/download.html
          test -f web/index.html
          test -f web/version.json
          test -f web/_headers
          test -f functions/api/apk-status.js

      - name: Publish static /web bundle to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=sociodetective
